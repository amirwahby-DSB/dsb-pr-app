workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project files
        script: |
          flutter create --platforms=android .
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Accept Android licenses
        script: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
  web-workflow:
    name: Web Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - firebase
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build web
        script: |
          flutter build web --release --no-tree-shake-icons
      - name: Deploy to Firebase Hosting
        script: |
          echo $FIREBASE_SERVICE_ACCOUNT > /tmp/firebase_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase_key.json
          npm install -g firebase-tools || true
          firebase deploy --only hosting --project dsba-pr-app --non-interactive
